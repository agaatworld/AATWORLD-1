<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explainer Toolbar</title>
    <style>
      /* Transparent until the view decides otherwise: overlays and the toolbar
         must never flash an opaque rectangle over the desktop. */
      html, body { margin: 0; background: transparent; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
