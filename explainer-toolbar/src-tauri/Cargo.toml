[package]
name = "explainer-toolbar"
version = "0.1.0"
description = "Explainer Toolbar: draw, point and explain over any Windows application."
edition = "2021"
license = "MIT"
publish = false
default-run = "explainer-toolbar"

[workspace]
members = ["core"]

[lib]
name = "explainer_toolbar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
explainer-core = { path = "core" }
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-log = "2.10.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = true
