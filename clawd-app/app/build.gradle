plugins { id 'com.android.application' }

android {
    namespace 'com.aat.clawd'
    compileSdk 34
    defaultConfig {
        applicationId 'com.aat.clawd'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        // fixed key so every new build installs over the old one
        fixed {
            storeFile file('../clawd.keystore')
            storePassword 'clawd123'
            keyAlias 'clawd'
            keyPassword 'clawd123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { signingConfig signingConfigs.fixed; minifyEnabled false }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
