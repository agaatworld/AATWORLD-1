<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@700&family=Noto+Sans+TC:wght@900&display=block">
<style>
/* Spine of issue 561 (print only, not on the web). 300 dpi px: 3508 tall; the width is set by finish.py (6 mm = 71 px default).
   Like the owner's 2014 issue: white spine, red text, read from the bottom up, Chinese name at the foot, Arabic name at the head. */
@font-face { font-family: Jazeera; src: url(../../assets/fonts/aljazeera-bold.ttf); font-weight: 700; }
html, body { margin: 0; }
.sp { position: relative; width: 71px; height: 3508px; background: #fff; overflow: hidden; }
.sp::before, .sp::after { content: ""; position: absolute; left: 0; right: 0; height: 22px; background: #D21F26; }
.sp::before { top: 0; } .sp::after { bottom: 0; }
.t { position: absolute; left: 35.5px; top: 1754px; width: 3300px; height: 71px; margin: -35.5px 0 0 -1650px; transform: rotate(-90deg);
  display: flex; align-items: center; justify-content: space-between; padding: 0 110px; box-sizing: border-box; color: #C4141C; white-space: nowrap; }
.t .zh { font: 900 42px/1 "Noto Sans TC"; letter-spacing: 2px; }
.t .ar { font: 700 44px/1 Jazeera, Arimo; direction: rtl; }
.t .ar b { font: 700 40px/1 Arimo; }
.t .la { font: 700 40px/1 Arimo; letter-spacing: 1px; }
.t img { height: 46px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #D21F26; }
</style></head><body>
<div class="sp" data-shot="spine"><div class="t">
  <span class="zh">中阿商業雜誌</span><i class="dot"></i>
  <span class="ar">عدد نوفمبر <b>2026</b></span><i class="dot"></i>
  <span class="ar">السنة <b>45</b></span><i class="dot"></i>
  <img src="../brand/logo/AAT-logo-red.svg" alt=""><i class="dot"></i>
  <span class="la">Arab Asian Trade</span><i class="dot"></i>
  <span class="la">ISSUE NO. 561</span><i class="dot"></i>
  <span class="ar">التجارة العربية الآسيوية</span>
</div></div>
</body></html>
