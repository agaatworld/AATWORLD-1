<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AAT Motion Identity</title>
<style>
:root { --red: #D21F26; --ink: #141012; --mute: #6b6164; --line: #e7dfdc; --bg: #faf8f7; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 Arial, Helvetica, sans-serif; }
header { padding: 36px 24px 20px; max-width: 1280px; margin: auto; }
h1 { margin: 0 0 6px; font-size: 32px; } h1 span { color: var(--red); }
p.lead { margin: 0; color: var(--mute); max-width: 820px; }
.bar { position: sticky; top: 0; z-index: 2; background: rgba(250,248,247,.95); border-bottom: 1px solid var(--line); }
.bar .in { max-width: 1280px; margin: auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar b { margin-inline-end: 4px; }
button { font: inherit; font-size: 16px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
button.on { background: var(--red); color: #fff; border-color: var(--red); }
main { max-width: 1280px; margin: auto; padding: 20px 24px 60px; display: grid; gap: 28px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.card.rec { border: 2px solid var(--red); }
.card .hd { display: flex; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card h2 { margin: 0; font-size: 22px; } .card h2 i { color: var(--red); font-style: normal; margin-inline-end: 8px; }
.tag { font-size: 15px; background: var(--red); color: #fff; padding: 3px 10px; border-radius: 20px; align-self: center; }
.card p { margin: 0; padding: 12px 20px 0; color: var(--mute); }
.vids { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; padding: 16px 20px 20px; align-items: start; }
figure { margin: 0; } figcaption { font-size: 15px; color: var(--mute); margin-top: 6px; }
video { width: 100%; display: block; border-radius: 8px; background: #000; }
</style></head><body>
<header><h1><span>AAT</span> Motion Identity</h1>
<p class="lead">Six concepts built from the real AAT artwork (the original paths of the logo, the original red #D21F26). Every version ends on the exact original logo. Sound effects only, no music. Videos below play with sound; silent copies are next to them in each folder.</p></header>
<div class="bar"><div class="in">
  <b>Format</b><button data-a="16x9" class="on">16:9</button><button data-a="1x1">1:1</button><button data-a="9x16">9:16</button>
  <b style="margin-inline-start:14px">Length</b><button data-d="ultra">0.6 s</button><button data-d="short">1.2 s</button><button data-d="std" class="on">2.5 s</button><button data-d="ext">4.5 s</button>
</div></div>
<main id="list"></main>
<script>
const C = [
  ['c1', 'The Signature Curve', 'Recommended primary AAT signature. One light travels the real centre lines of the letters: the curl and swash of the first A, the second A, then the T. The red letterforms appear behind it, then the tagline slides in. Outro: the swash itself, scaled to the frame, wipes the last shot away.', true],
  ['c2', 'Geometric Assembly', 'Each letter of the artwork is cut into bands that arrive through depth, letter by letter, and lock into their exact positions. Outro: the last shot splits into the same bands and slides away.'],
  ['c3', 'Cinematic Red Reveal', 'A dark room: the mark is a deep silhouette until one light travels across it with a narrow sheen, then the light opens to the full original red. Outro: the video darkens into the light.'],
  ['c4', 'Sculptural AAT', 'The real letterforms given satin-red depth, turning to face the viewer under a soft key light; the depth folds away into the flat original. Outro: the video is a card that swings away.'],
  ['c5', 'Negative Space & Optical Reveal', 'We start inside the first A: its counter and crossbar fill the frame as abstract shapes; the camera pulls out to the mark. Outro: the last shot is seen through the letters, then the letters fill with red.'],
  ['c6', 'AAT Motion Signature', 'A kinetic social system: hard-cut close-ups travel along the real forms, then one decisive pull-back. The swash, scaled to the frame, is the AAT transition (see the transition clips).'],
];
let A = '16x9', D = 'std';
function v(c, m, d, a) { return `<figure><video src="out/${c}/${c}-${m}-${d}-${a}_sfx.mp4" controls loop playsinline preload="metadata"></video><figcaption>${m === 'intro' ? 'Intro' : 'Outro'} · ${d} · ${a.replace('x', ':')}</figcaption></figure>`; }
function draw() {
  document.getElementById('list').innerHTML = C.map(([c, n, t, r]) => `<section class="card${r ? ' rec' : ''}"><div class="hd"><h2><i>${c.slice(1).padStart(2, '0')}</i>${n}</h2>${r ? '<span class="tag">Recommended</span>' : ''}</div><p>${t}</p>
    <div class="vids">${v(c, 'intro', D, A)}${v(c, 'outro', D, A)}${c === 'c6' ? `<figure><video src="out/c6/c6-transition-short-${A}_sfx.mp4" controls loop playsinline preload="metadata"></video><figcaption>Transition element · 1.2 s</figcaption></figure>` : ''}</div></section>`).join('');
}
document.querySelectorAll('[data-a]').forEach((b) => b.onclick = () => { A = b.dataset.a; document.querySelectorAll('[data-a]').forEach((x) => x.classList.toggle('on', x === b)); draw(); });
document.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => { D = b.dataset.d; document.querySelectorAll('[data-d]').forEach((x) => x.classList.toggle('on', x === b)); draw(); });
draw();
</script>
</body></html>
