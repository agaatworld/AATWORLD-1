<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800;900&family=Montserrat:wght@800&display=block">
<style>
/* EZICARGO box for the AAT cover: same slot as the top-left logo box of the July 2026 cover (34 x 47 mm = 128 x 178 css px) */
html, body { margin: 0; background: #fff; }
.box { width: 128px; height: 178px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; font-family: "Noto Kufi Arabic", sans-serif; color: #0E0E12; }
.box img { width: 86px; height: 86px; object-fit: contain; display: block; margin-top: 2px; }
.nm { margin-top: 1px; font: 900 15.5px/1.25 "Noto Kufi Arabic"; }
.of { margin-top: 4px; width: 124px; padding: 2px 0 3px; border-radius: 4px; background: linear-gradient(90deg, #B30000, #E10600); color: #fff; text-align: center; }
.of b { display: block; font: 900 14.5px/1.25 "Noto Kufi Arabic"; }
.of span { display: block; font: 700 10.5px/1.3 "Noto Kufi Arabic"; }
.see { margin-top: 4px; width: 118px; border-top: 1px solid #B9B9B9; padding-top: 3px; text-align: center; font: 700 11.5px/1.3 "Noto Kufi Arabic"; color: #222; }
</style></head>
<body>
<div class="box" data-shot="cover-box">
  <img src="brand/logo-full.png" alt="">
  <div class="nm">ايزي كارجو</div>
  <div class="of"><b>السكن مجّاني</b><span>خلال معارض ماليزيا</span></div>
  <div class="see">انظر وسط المجلة</div>
</div>
</body></html>
