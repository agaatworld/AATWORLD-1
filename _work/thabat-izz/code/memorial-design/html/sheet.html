<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:ThSans;src:url(../fonts/thmanyahsans-Bold.ttf);font-weight:700}
@font-face{font-family:ThSans;src:url(../fonts/thmanyahsans-Black.ttf);font-weight:900}
body{margin:0;background:#0A1220;font-family:ThSans;color:#F4E9D8;width:1920px}
h1{font:900 44px ThSans;margin:40px 50px 6px}h1 small{display:block;font:700 22px ThSans;color:#A8B3C1;margin-top:6px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;padding:24px 50px 50px}
figure{margin:0;position:relative}
figure img{width:100%;display:block;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
figcaption{display:flex;align-items:baseline;gap:12px;margin-top:12px;font:900 26px ThSans}
figcaption i{font-style:normal;color:#0A1220;background:#A8B3C1;border-radius:99px;padding:0 12px;font-size:22px}
figcaption span{font:700 19px ThSans;color:#A8B3C1}
figure.top figcaption i{background:#F2A541}
figure.top figcaption:after{content:"★ مختار";margin-inline-start:auto;background:#F2A541;color:#0A1220;font:900 22px ThSans;padding:4px 16px;border-radius:4px}
</style></head><body>
<h1>ستة اتجاهات تصميمية — سيرة الشهيد النقيب رائد الكحلاني<small>معاينات مربعة 1:1 · المختارة الثلاثة الأقوى للتطوير النهائي</small></h1>
<div class="g">
<figure class="top"><img src="../exports/previews/1-editorial-sq-focus.png"><figcaption><i>1</i>سجلّ الشرف<span>تحريري عسكري فاخر</span></figcaption></figure>
<figure class="top"><img src="../exports/previews/2-commander-sq-focus.png"><figcaption><i>2</i>القائد<span>هوية عسكرية قوية</span></figcaption></figure>
<figure class="top"><img src="../exports/previews/3-archive-sq-focus.png"><figcaption><i>3</i>الوثيقة<span>تذكاري تاريخي</span></figcaption></figure>
<figure><img src="../exports/previews/4-cinematic-sq-focus.png"><figcaption><i>4</i>الضوء الأخير<span>سينمائي حديث</span></figcaption></figure>
<figure><img src="../exports/previews/5-minimal-sq-focus.png"><figcaption><i>5</i>الهدوء<span>بسيط راقٍ</span></figcaption></figure>
<figure><img src="../exports/previews/6-timeline-sq-focus.png"><figcaption><i>6</i>خطّ العمر<span>إنفوغرافيك توثيقي</span></figcaption></figure>
</div></body></html>
