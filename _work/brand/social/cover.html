<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
@font-face{font-family:Jazeera;src:url(aljazeera-bold.ttf);font-weight:700}
@font-face{font-family:Inter Tight;src:url(inter-tight-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Inter Tight;src:url(inter-tight-latin-600-normal.woff2);font-weight:600}
html,body{margin:0}
.c{position:relative;width:820px;height:360px;overflow:hidden;background:url(aat-pattern-red.svg) 0 0/72px 72px repeat,radial-gradient(120% 90% at 50% 30%,#D9252C 0%,#D21F26 55%,#B5161D 100%);font-family:"Inter Tight",sans-serif;color:#fff}
.box{position:absolute;left:50%;top:50px;transform:translateX(-50%);background:#fff;border-radius:16px;padding:16px 34px 12px;box-shadow:0 14px 30px -16px rgba(60,0,4,.55)}
.box img{display:block;width:250px;height:auto}
.names{position:absolute;left:0;right:0;top:184px;text-align:center;font-weight:800;font-size:22px;white-space:nowrap}
.names .ar{font-family:Jazeera,sans-serif;font-weight:700;font-size:25px}
.names .zh{font-family:"Noto Sans TC",sans-serif;font-weight:900;font-size:21px}
.names i{font-style:normal;opacity:.75;margin:0 10px}
.tag{position:absolute;left:0;right:0;top:226px;text-align:center;font-weight:600;font-size:15.5px;opacity:.95;white-space:nowrap}
.tag b{font-weight:800}
.guide .safe{position:absolute;left:90px;top:24px;width:640px;height:312px;outline:2px dashed #0f0}
.guide .pp{position:absolute;left:325px;top:268px;width:170px;height:170px;border-radius:50%;outline:3px dashed #ff0}
.guide .band{position:absolute;left:0;top:24px;width:820px;height:312px;outline:2px dashed #0ff}
</style></head><body>
<div class="c" id="c">
 <div class="box"><img src="AAT-logo-red.svg" alt=""></div>
 <div class="names">Arab Asian Trade<i>·</i><span class="ar" dir="rtl">التجارة العربية الآسيوية</span><i>·</i><span class="zh">中阿商業雜誌</span></div>
 <div class="tag">The first and only Arab-Asian trade magazine<i style="font-style:normal;opacity:.7;margin:0 8px">·</i>since 1982<i style="font-style:normal;opacity:.7;margin:0 8px">·</i><b>www.aatworld.com</b></div>
 <div class="guide" id="g" hidden><div class="band"></div><div class="safe"></div><div class="pp"></div></div>
</div></body></html>
