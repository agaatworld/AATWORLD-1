name: Clawd Android app

on:
  push:
    paths:
      - 'clawd-app/app/**'
      - 'clawd-app/ci/**'
      - 'clawd-app/*.gradle'
      - '.github/workflows/clawd-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        run: |
          gradle -p clawd-app assembleRelease --no-daemon --stacktrace
          mkdir -p clawd-app/dist
          rm -f clawd-app/dist/*.png
          cp clawd-app/app/build/outputs/apk/release/app-release.apk clawd-app/dist/clawd.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Try it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash clawd-app/ci/emu.sh
      - name: Save APK and screenshots to the branch
        run: |
          git config user.name "clawd-ci"
          git config user.email "clawd-ci@users.noreply.github.com"
          git add clawd-app/dist
          git commit -m "Clawd: built APK and emulator screenshots [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
