# Builds and tests Explainer Toolbar (the folder explainer-toolbar/ only).
# Runs only on this development branch, only when that folder changes.
name: Explainer Toolbar

on:
  push:
    branches: [ccr-c9eb3146-t80tdj]
    paths: ["explainer-toolbar/**", ".github/workflows/explainer-toolbar.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explainer-toolbar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-and-core-tests:
    name: UI, engine and core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: explainer-toolbar
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            explainer-toolbar
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: explainer-toolbar/package-lock.json
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Engine unit tests
        run: npm test
      - name: Build the pages
        run: npm run build
      - name: UI tests (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --trace off
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Core logic tests (state machine, storage, shortcuts, layout)
        working-directory: explainer-toolbar/src-tauri
        run: |
          cargo test -p explainer-core
          cargo clippy -p explainer-core --all-targets -- -D warnings

  windows:
    name: Windows build, native self-test and installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: explainer-toolbar
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            explainer-toolbar
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: explainer-toolbar/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: explainer-toolbar/src-tauri -> target
      - run: npm ci
      - name: Build the pages (embedded into the Rust app at compile time)
        run: npm run build
      - name: Clippy (warnings are errors)
        working-directory: explainer-toolbar/src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        working-directory: explainer-toolbar/src-tauri
        run: cargo test --workspace
      - name: Build the app and the NSIS installer
        run: npx tauri build --bundles nsis
      - name: Native self-test (real windows, real Win32 styles and hit-testing)
        run: |
          $exe = "src-tauri/target/release/explainer-toolbar.exe"
          $report = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; throw "self-test did not finish in 4 minutes" }
          if (-not (Test-Path $report)) { throw "self-test wrote no report (exit code $($p.ExitCode))" }
          Get-Content $report
          $r = Get-Content $report -Raw | ConvertFrom-Json
          foreach ($c in $r.checks) { "{0}  {1}  {2}" -f ($(if ($c.pass) { "PASS" } else { "FAIL" })), $c.name, $c.detail }
          if (-not $r.passed) { throw "self-test failed (exit code $($p.ExitCode))" }
      - name: Collect logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/diag" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/selftest.json" "$env:RUNNER_TEMP/diag/" -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA/com.explainertoolbar.desktop/logs/*" "$env:RUNNER_TEMP/diag/" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test-report-and-logs
          path: ${{ runner.temp }}/diag
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Explainer-Toolbar-Windows-installer
          path: explainer-toolbar/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
